      tests:
        - "tests/test_journal_posting.py"
      
      total_lines: 280
    
    testing_guide: FMS-005
    
    commit_message: |
      feat(accounting): implement journal posting & GL integration
      
      - Sales journal: DR Fuel COGS | CR Fuel Revenue
      - Residual allocation: DR from_product COGS | CR to_product COGS
      - Cash variance: DR FC Cash | CR Employee/Expense
      - Stock adjustments: Update inventory via stock.inventory
      
      All entries posted via account.move (standard GL)
      
