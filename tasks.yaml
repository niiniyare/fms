  # ═════════════════════════════════════════════════════════════════════
  
  FMS-006:
    title: "Shift Lifecycle & Hard Gates"
    description: |
      Implement shift state machine (Draft → Open → Closing → Closed),
      validation gates (FC Cash = 0, all attendants clear, stock variance < meniscus),
      opening shift workflow (fetch previous readings), closing workflow
    
    status: TODO
    spec_reference: "Spec Section 3.2, Section 8.1"
    
    estimated_time: "1h 30m"
    actual_time: "0h"
    
    dependencies:
      - FMS-002  # Requires entry models
      - FMS-003  # Requires residuals
    
    subtasks:
      - "FMS-006-A: State machine (Draft → Open → Closing → Closed, ~40 lines)"
      - "FMS-006-B: Hard gate 1: FC Cash must = 0 (_check_fc_cash, ~30 lines)"
      - "FMS-006-C: Hard gate 2: All attendants clear (validation, ~30 lines)"
      - "FMS-006-D: Hard gate 3: Stock variance < meniscus (validation, ~30 lines)"
      - "FMS-006-E: action_open_shift & action_close_shift methods (~100 lines)"
      - "FMS-006-F: Unit tests (6+ tests)"
    
    artifacts:
      models:
        - "models/fms_shift.py (state machine & gates)"
      
      tests:
        - "tests/test_shift_lifecycle.py"
      
      total_lines: 260
    
    testing_guide: FMS-006
    
    commit_message: |
      feat(workflow): implement shift lifecycle & hard gates
      
      State machine: Draft → Open → Closing → Closed (no re-open)
      Hard gate 1: FC Cash must equal zero exactly (no override)
      Hard gate 2: All attendants must clear (no override)
      Hard gate 3: Stock variance < meniscus % (no override)
      
      Action: open_shift (fetch prev readings, create entry lines)
      Action: close_shift (validate gates, write logs, post journals)
      
      Ref: Spec Section 3.2
      Tests: 6/6 passing
      Task: FMS-006

