    subtasks:
      - "FMS-004-A: Define groups (ir.group definitions, ~60 lines)"
      - "FMS-004-B: Model-level access rules (ir.model.access, ~50 lines)"
      - "FMS-004-C: Row-level security (ir.rule, company scoping, ~40 lines)"
      - "FMS-004-D: Log immutability enforcement (already in models)"
      - "FMS-004-E: Unit tests (5+ tests)"
    
    artifacts:
      security:
        - "security/fms_groups.xml (group definitions)"
        - "security/ir_model_access.xml (CRUD permissions per group)"
        - "security/ir_rule.xml (row-level security)"
      
      tests:
        - "tests/test_security.py"
      
      total_lines: 200
    
    testing_guide: FMS-004
    
    commit_message: |
      feat(security): implement RBAC & row-level security
      
      Groups:
      - fuel_station_attendant: enter data, cannot close
      - fuel_station_supervisor: close shifts, post corrections
      - fuel_station_accountant: read-only reporting
      
      Row-level: Users see only own company's shifts
      Immutability: Logs locked after shift close
      
      Ref: Spec Section 9
      Tests: 5/5 passing
      Task: FMS-004

