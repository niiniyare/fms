      - "FMS-005-B: Residual allocation journal (_post_residual_allocation_journal, ~50 lines)"
      - "FMS-005-C: Cash variance posting (_post_cash_variance_journal, ~50 lines)"
      - "FMS-005-D: Stock inventory adjustments (_post_inventory_adjustments, ~70 lines)"
      - "FMS-005-E: Integration tests (8+ tests)"
    
    artifacts:
