  # ═════════════════════════════════════════════════════════════════════
  
  FMS-003:
    title: "Residual Allocation Algorithm"
    description: |
      Implement automatic residual allocation: detect lumped non-fuel sales
      (e.g., carwash in Diesel) and auto-reallocate to correct product.
      Includes calculation, allocation, and audit trail.
    
    status: TODO
    spec_reference: "Spec Section 7.1"
    
    estimated_time: "2h"
    actual_time: "0h"
    
    dependencies:
      - FMS-001  # Requires base models
      - FMS-002  # Requires entry models
    
    subtasks:
      - "FMS-003-A: Product sales reconciliation computation (_compute_product_sales)"
      - "FMS-003-B: Residual detection & calculation (_calculate_residuals prep)"
      - "FMS-003-C: Greedy allocation algorithm (_calculate_residuals impl)"
      - "FMS-003-D: Allocation audit trail (fms.shift.residual.allocation)"
      - "FMS-003-E: Unit tests (6+ tests)"
    
    artifacts:
      models:
        - "models/fms_shift_reconciliation.py (_calculate_residuals method)"
      
      tests:
        - "tests/test_residual_allocation.py"
      
      total_lines: 280
    
    testing_guide: FMS-003
    
    commit_message: |
      feat(algorithms): implement residual allocation
      
      - Product sales reconciliation (meter vs. accounted)
      - Residual detection (over/under reported)
      - Greedy allocation algorithm
      - Allocation audit trail
      
      Example: Diesel -100L (over) → Carwash +100L (under)
      
      Ref: Spec Section 7.1
      Tests: 6/6 passing
      Task: FMS-003

